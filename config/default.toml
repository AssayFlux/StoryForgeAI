# Baseline configuration. Paths are relative to the application data directory
# unless a future module documents otherwise. No model is downloaded or loaded
# automatically by this configuration.

[application]
name = "StoryForge AI"
language = "en"
offline_first = true
allow_network_by_default = false

[hardware]
# Conservative starting point for an 8 GB Android device.
max_loaded_models = 1
process_long_media_in_segments = true

[storage]
# These directories are local runtime data and are excluded from Git.
projects_dir = "projects"
models_dir = "models"
assets_dir = "assets"
